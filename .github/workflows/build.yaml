name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish Plugin Artifacts
        run: dotnet publish src/Jellyfin.Plugin.NextUpRewatch/Jellyfin.Plugin.NextUpRewatch.csproj --configuration Release --output publish

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.NextUpRewatch
          path: publish/
